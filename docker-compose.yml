name: eloquent-runs

services:
  app:
    image: ghcr.io/whilesmartphp/laravel-dev:package-8.4
    volumes:
      - .:/app
    working_dir: /app
    command: tail -f /dev/null
    environment:
      - APP_ENV=testing

  mysql:
    image: mysql:8.0
    profiles: [mysql]
    environment:
      MYSQL_ROOT_PASSWORD: testing-password
      MYSQL_DATABASE: runs_tests
    healthcheck:
      test: [CMD, mysqladmin, ping, --silent]
      interval: 5s
      timeout: 5s
      retries: 20
